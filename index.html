<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control — Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0b;
            --card: #1a1a1d;
            --border: #27272a;
            --text: #fafafa;
            --muted: #71717a;
            --backlog: #3f3f46;
            --in-progress: #3b82f6;
            --review: #f97316;
            --blocked: #ef4444;
            --done: #22c55e;
            --soon: #a855f7;
            --high: #ef4444;
            --medium: #f97316;
            --low: #22c55e;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 18px; font-weight: 700; }
        .live-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
        .live-dot span { width: 8px; height: 8px; border-radius: 50%; background: var(--done); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .board { display: flex; gap: 16px; padding: 20px; overflow-x: auto; min-height: calc(100vh - 80px); }
        .column { flex: 0 0 280px; background: var(--card); border-radius: 12px; display: flex; flex-direction: column; }
        .col-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .col-header h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .col-count { background: var(--bg); padding: 2px 8px; border-radius: 10px; font-size: 11px; color: var(--muted); }
        .col-badge { width: 8px; height: 8px; border-radius: 50%; }
        .col-backlog .col-badge { background: var(--backlog); }
        .col-to_do .col-badge { background: var(--in-progress); }
        .col-in_progress .col-badge { background: var(--in-progress); }
        .col-needs_review .col-badge { background: var(--review); }
        .col-blocked .col-badge { background: var(--blocked); }
        .col-done .col-badge { background: var(--done); }
        .cards { padding: 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 100px; }
        .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: grab; transition: border-color 0.15s; }
        .card:hover { border-color: #3f3f46; }
        .card.dragging { opacity: 0.5; }
        .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .priority { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .priority.high { background: rgba(239,68,68,0.2); color: var(--high); }
        .priority.medium { background: rgba(249,115,22,0.2); color: var(--medium); }
        .priority.low { background: rgba(34,197,0,0.2); color: var(--low); }
        .card-id { font-size: 10px; color: var(--muted); }
        .card-title { font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
        .card-desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }
        .comment-count { display: flex; align-items: center; gap: 3px; cursor: pointer; }
        .comment-count:hover { color: var(--text); }
        .sortable-ghost { opacity: 0.3; }
        .add-card { padding: 12px; border-top: 1px solid var(--border); }
        .add-card-btn { width: 100%; padding: 10px; background: none; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 13px; transition: all 0.15s; }
        .add-card-btn:hover { border-color: var(--text); color: var(--text); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; }
        .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-primary { background: var(--in-progress); color: white; }
        .btn-danger { background: var(--blocked); color: white; }
        .btn:hover { opacity: 0.85; }
        .comments-section { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
        .comment { margin-bottom: 12px; }
        .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .comment-author { font-size: 12px; font-weight: 600; }
        .comment-time { font-size: 11px; color: var(--muted); }
        .comment-body { font-size: 13px; color: var(--text); line-height: 1.5; padding-left: 28px; }
        .comment-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .comment-input-wrap input { flex: 1; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
        .comment-input-wrap button { padding: 8px 14px; background: var(--in-progress); color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .empty-state { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 12px; }
        [hidden] { display: none !important; }
        .updated-at { font-size: 11px; color: var(--muted); text-align: center; padding: 8px; }
    </style>
</head>
<body>
<header>
    <h1>📋 Task Board</h1>
    <div class="live-dot"><span></span> <span id="live-label">Live</span></div>
</header>

<div class="board">
    <div class="column col-backlog" data-status="backlog">
        <div class="col-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="col-badge"></div>
                <h2>Backlog</h2>
            </div>
            <span class="col-count" id="count-backlog">0</span>
        </div>
        <div class="cards" id="cards-backlog"></div>
        <div class="add-card">
            <button class="add-card-btn" onclick="openAddModal('backlog')">+ Add task</button>
        </div>
    </div>

    <div class="column col-to_do" data-status="to_do">
        <div class="col-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="col-badge"></div>
                <h2>To Do</h2>
            </div>
            <span class="col-count" id="count-to_do">0</span>
        </div>
        <div class="cards" id="cards-to_do"></div>
        <div class="add-card">
            <button class="add-card-btn" onclick="openAddModal('to_do')">+ Add task</button>
        </div>
    </div>

    <div class="column col-in_progress" data-status="in_progress">
        <div class="col-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="col-badge"></div>
                <h2>In Progress</h2>
            </div>
            <span class="col-count" id="count-in_progress">0</span>
        </div>
        <div class="cards" id="cards-in_progress"></div>
        <div class="add-card">
            <button class="add-card-btn" onclick="openAddModal('in_progress')">+ Add task</button>
        </div>
    </div>

    <div class="column col-needs_review" data-status="needs_review">
        <div class="col-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="col-badge"></div>
                <h2>Review</h2>
            </div>
            <span class="col-count" id="count-review">0</span>
        </div>
        <div class="cards" id="cards-review"></div>
        <div class="add-card">
            <button class="add-card-btn" onclick="openAddModal('review')">+ Add task</button>
        </div>
    </div>

    <div class="column col-blocked" data-status="blocked">
        <div class="col-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="col-badge"></div>
                <h2>Blocked</h2>
            </div>
            <span class="col-count" id="count-blocked">0</span>
        </div>
        <div class="cards" id="cards-blocked"></div>
        <div class="add-card">
            <button class="add-card-btn" onclick="openAddModal('blocked')">+ Add task</button>
        </div>
    </div>

    <div class="column col-done" data-status="done">
        <div class="col-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="col-badge"></div>
                <h2>Done</h2>
            </div>
            <span class="col-count" id="count-done">0</span>
        </div>
        <div class="cards" id="cards-done"></div>
        <div class="add-card">
            <button class="add-card-btn" onclick="openAddModal('done')">+ Add task</button>
        </div>
    </div>
</div>

<div class="updated-at">Updated: <span id="updated-time">—</span></div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modal-overlay" hidden onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <h3 id="modal-title">Add Task</h3>
        <input type="hidden" id="task-id">
        <div class="form-group">
            <label>Title *</label>
            <input type="text" id="task-title" placeholder="What needs to be done?">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="task-desc" placeholder="Details, context, links..."></textarea>
        </div>
        <div style="display:flex;gap:12px">
            <div class="form-group" style="flex:1">
                <label>Priority</label>
                <select id="task-priority">
                    <option value="high">🔴 High</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="low">🟢 Low</option>
                </select>
            </div>
            <div class="form-group" style="flex:1">
                <label>Assignee</label>
                <select id="task-assignee">
                    <option value="zeanna" selected>🤖 Zeanna</option>
                    <option value="ganz">👤 Ganz</option>
                </select>
            </div>
        </div>
        <div class="form-group" id="status-group">
            <label>Status</label>
            <select id="task-status">
                <option value="backlog">Backlog</option>
                <option value="to_do">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="needs_review">Needs Review</option>
                <option value="soon">Soon</option>
                <option value="blocked">Blocked</option>
                <option value="done">Done</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-danger" id="delete-btn" onclick="deleteTask()" hidden>Delete</button>
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveTask()">Save</button>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-overlay" hidden onclick="if(event.target===this)closeDetail()">
    <div class="modal">
        <h3 id="detail-title">Task</h3>
        <div id="detail-body"></div>
        <div class="comments-section">
            <div style="font-size:12px;color:var(--muted);margin-bottom:10px">COMMENTS</div>
            <div id="detail-comments"></div>
            <div class="comment-input-wrap">
                <input type="text" id="comment-input" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')addComment()">
                <button onclick="addComment()">Post</button>
            </div>
        </div>
        <div class="modal-actions" style="margin-top:16px">
            <button class="btn btn-secondary" onclick="closeDetail()">Close</button>
        </div>
    </div>
</div>

<script>
const SB_URL = 'https://lyhhfqbkwamodswxewql.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5aGhmcWJrd2Ftb2Rzd3hld3FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzI5MTgsImV4cCI6MjA5Mzc0ODkxOH0.Q6NxVxTyok58Hag62754kFq-LQEw5O_w0NP5p093j-g';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const STATUSES = ['backlog','to_do','in_progress','needs_review','blocked','done','soon'];
let tasks = [];
let currentDetailId = null;
let currentDetailComments = [];

function timeAgo(date) {
    const diff = Date.now() - new Date(date).getTime();
    const m = Math.floor(diff/60000);
    if(m<1) return 'just now';
    if(m<60) return m+'m ago';
    const h = Math.floor(m/60);
    if(h<24) return h+'h ago';
    return Math.floor(h/24)+'d ago';
}

function renderTasks() {
    STATUSES.forEach(s => {
        const count = tasks.filter(t=>t.status===s).length;
        document.getElementById('count-'+s).textContent = count;
    });
    STATUSES.forEach(s => {
        const el = document.getElementById('cards-'+s);
        el.innerHTML = '';
        tasks.filter(t=>t.status===s).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach(t => {
            el.innerHTML += cardHTML(t);
        });
    });
    initSortable();
    document.getElementById('updated-time').textContent = new Date().toLocaleTimeString();
}

function cardHTML(t) {
    return '<div class="card" data-id="'+t.id+'" onclick="openDetail(\''+t.id+'\')">'+
        '<div class="card-top"><span class="priority '+t.priority+'">'+t.priority+'</span><span class="card-id">#'+t.id.slice(0,6)+'</span></div>'+
        '<div class="card-title">'+escape(t.title)+'</div>'+
        (t.description ? '<div class="card-desc">'+escape(t.description)+'</div>' : '')+
        '<div class="card-footer"><span>'+timeAgo(t.created_at)+'</span><span class="comment-count" onclick="event.stopPropagation();openDetail(\''+t.id+'\')">💬 '+(t.comment_count||0)+'</span></div>'+
        '</div>';
}

function escape(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function initSortable() {
    STATUSES.forEach(s => {
        const el = document.getElementById('cards-'+s);
        if(el._sortable) el._sortable.destroy();
        el._sortable = new Sortable(el, {
            group: 'tasks', animation: 150,
            onEnd: async (evt) => {
                const id = evt.item.dataset.id;
                const newStatus = evt.to.id.replace('cards-','');
                await sb.from('tasks').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
                const t = tasks.find(x=>x.id===id);
                if(t) { t.status = newStatus; renderTasks(); }
            }
        });
    });
}

async function openAddModal(status) {
    document.getElementById('modal-title').textContent = 'Add Task';
    document.getElementById('task-id').value = '';
    document.getElementById('task-title').value = '';
    document.getElementById('task-desc').value = '';
    document.getElementById('task-priority').value = 'medium';
    document.getElementById('task-assignee').value = 'zeanna';
    document.getElementById('task-status').value = status;
    document.getElementById('status-group').hidden = false;
    document.getElementById('delete-btn').hidden = true;
    document.getElementById('modal-overlay').hidden = false;
}

async function openDetail(id) {
    currentDetailId = id;
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    document.getElementById('detail-title').textContent = t.title;
    document.getElementById('detail-body').innerHTML =
        '<div style="margin-bottom:16px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">STATUS</div>'+
        '<span class="priority '+t.priority+'" style="margin-right:8px">'+t.priority+'</span>'+
        '<span style="font-size:13px">'+t.status.replace('_',' ')+'</span></div>'+
        (t.description ? '<div style="margin-bottom:16px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">DESCRIPTION</div>'+
        '<div style="font-size:13px;line-height:1.6">'+escape(t.description).replace(/\n/g,'<br>')+'</div></div>' : '')+
        '<div style="font-size:12px;color:var(--muted)">Assigned to: '+t.assignee+' · Created '+timeAgo(t.created_at)+'</div>';
    const { data: comments } = await sb.from('task_comments').select('*').eq('task_id', id).order('created_at');
    currentDetailComments = comments || [];
    renderComments();
    document.getElementById('detail-overlay').hidden = false;
}

function renderComments() {
    document.getElementById('detail-comments').innerHTML = currentDetailComments.length === 0
        ? '<div style="font-size:12px;color:var(--muted)">No comments yet</div>'
        : currentDetailComments.map(c => '<div class="comment"><div class="comment-header"><span class="comment-author">'+escape(c.author)+'</span><span class="comment-time">'+timeAgo(c.created_at)+'</span></div><div class="comment-body">'+escape(c.content)+'</div></div>').join('');
}

async function addComment() {
    const input = document.getElementById('comment-input');
    const content = input.value.trim();
    if(!content || !currentDetailId) return;
    const { data } = await sb.from('task_comments').insert({ task_id: currentDetailId, author: 'Ganz', content }).select().single();
    if(data) { currentDetailComments.push(data); renderComments(); input.value = ''; }
}

function closeModal() { document.getElementById('modal-overlay').hidden = true; }
function closeDetail() { document.getElementById('detail-overlay').hidden = true; currentDetailId = null; }

async function saveTask() {
    const title = document.getElementById('task-title').value.trim();
    if(!title) return alert('Title required');
    const id = document.getElementById('task-id').value;
    const payload = {
        title, description: document.getElementById('task-desc').value.trim(),
        priority: document.getElementById('task-priority').value,
        assignee: document.getElementById('task-assignee').value,
        status: document.getElementById('task-status').value,
        updated_at: new Date().toISOString()
    };
    if(id) {
        await sb.from('tasks').update(payload).eq('id', id);
    } else {
        await sb.from('tasks').insert(payload);
    }
    closeModal();
    loadTasks();
}

async function deleteTask() {
    if(!confirm('Delete this task?')) return;
    const id = document.getElementById('task-id').value;
    await sb.from('tasks').delete().eq('id', id);
    closeModal();
    loadTasks();
}

async function loadTasks() {
    const { data } = await sb.from('tasks').select('*').order('sort_order');
    const { data: comments } = await sb.from('task_comments').select('task_id');
    const countMap = {};
    (comments||[]).forEach(c => { countMap[c.task_id] = (countMap[c.task_id]||0) + 1; });
    tasks = (data||[]).map(t => ({ ...t, comment_count: countMap[t.id]||0 }));
    renderTasks();
}

loadTasks();

sb.channel('tasks').on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, loadTasks)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'task_comments' }, () => { if(currentDetailId) openDetail(currentDetailId); })
  .subscribe();
</script>
</body>
</html>
